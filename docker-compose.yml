services:
  novel-portfolio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novel-portfolio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      - NODE_ENV=production